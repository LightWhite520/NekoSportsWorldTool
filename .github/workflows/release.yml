# NekoSportsWorldTool 自动发布
#
# 触发方式：
#   ① 推送 tag：  git tag v0.2.0 && git push origin v0.2.0
#   ② 手动：     Actions 页面 Run workflow（可选 full/cli 模式，仅出构建产物）
#   ③ 发布草稿：手动填写 publish_draft_tag，校验已有附件后发布，不重复构建
#
# 注意：本文件需位于仓库根 .github/workflows/ 下
#（若仓库根就是 gui-rs 目录内容则无需调整；否则把 .github 移到仓库根）。
#
# Release 说明：workflow 已开启 generate_release_notes（按 commits 自动生成
# What's Changed），并附加固定的平台下载说明；如需自定义可在仓库根放

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: 构建模式
        type: choice
        default: full
        options: [full, cli]
      macos_runner:
        description: macOS 运行器（latest 长时间排队时可选 macos-15）
        type: choice
        default: macos-latest
        options: [macos-latest, macos-15]
      publish_draft_tag:
        description: 仅发布已有草稿的标签（留空则构建；需含五个平台包、对比图及校验文件）
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    if: ${{ inputs.publish_draft_tag == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            mode: full
            artifact: NekoSportsWorldTool-win-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            mode: full
            artifact: NekoSportsWorldTool-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            mode: cli
            artifact: NekoSportsWorldTool-linux-x64
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            mode: cli
            artifact: NekoSportsWorldTool-linux-aarch64
            cross: true
    runs-on: ${{ matrix.os == 'macos-latest' && github.event.inputs.macos_runner || matrix.os }}
    env:
      # Keep CLI-only targets in CLI mode during a manual full build.
      MODE: ${{ matrix.mode == 'cli' && 'cli' || github.event.inputs.mode || matrix.mode }}
      TARGET: ${{ matrix.target }}
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux 交叉编译)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (CLI-only)
        if: env.MODE == 'cli'
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked --release --target "$TARGET" --no-default-features
          else
            cargo build --locked --release --target "$TARGET" --no-default-features
          fi
        shell: bash

      - name: Build (full = GUI + CLI)
        if: env.MODE == 'full'
        run: cargo build --locked --release --target "$TARGET"
        shell: bash

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/$TARGET/release/nekosportsworldtool
          if [ "${{ matrix.os }}" = "windows-latest" ]; then BIN="$BIN.exe"; fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "dist/$ARTIFACT.zip" "$BIN"
          else
            tar czf "dist/$ARTIFACT.tar.gz" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  publish-draft:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_draft_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-draft-${{ inputs.publish_draft_tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.publish_draft_tag }}
    steps:
      - name: 校验草稿附件并发布
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          tag = os.environ['RELEASE_TAG']
          fields = 'isDraft,isPrerelease,tagName,targetCommitish,assets,body,url'

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def view():
              return json.loads(gh('release', 'view', tag, '--json', fields))

          def snapshot(value):
              metadata = {key: value[key] for key in (
                  'isDraft', 'isPrerelease', 'tagName', 'targetCommitish', 'body')}
              metadata['assets'] = sorted(
                  (a['id'], a['name'], a['size'], a['digest'], a['state'])
                  for a in value['assets'])
              return metadata

          release = view()
          require(release['isDraft'], '该 Release 不是草稿，停止操作。')
          require(re.fullmatch(r'[0-9a-f]{40}', release['targetCommitish']),
                  '草稿必须绑定完整构建提交 SHA，不能使用可移动的分支名。')
          expected = {
              'NekoSportsWorldTool-win-x64.zip',
              'NekoSportsWorldTool-macos-arm64.tar.gz',
              'NekoSportsWorldTool-linux-x64.tar.gz',
              'NekoSportsWorldTool-linux-aarch64.tar.gz',
              'NekoSportsWorldTool-android-arm64.apk',
              'motion-comparison.png',
          }
          assets = {asset['name']: asset for asset in release['assets']}
          require(len(assets) == len(release['assets'])
                  and set(assets) == expected | {'SHA256SUMS.txt'},
                  '草稿附件不完整或包含额外文件。')
          require(all(a['state'] == 'uploaded' and a['size'] > 0 for a in assets.values()),
                  '存在未完成上传或空附件。')

          output = Path('release-assets')
          gh('release', 'download', tag, '--dir', str(output))
          checksums = {}
          for line in (output / 'SHA256SUMS.txt').read_text().splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  (.+)', line)
              require(match is not None, '校验文件格式错误。')
              digest, name = match.groups()
              require(name in expected and name not in checksums, '校验文件含未知或重复附件。')
              checksums[name] = digest
          require(set(checksums) == expected, '校验文件缺少附件。')
          for name, asset in assets.items():
              data = (output / name).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              require(len(data) == asset['size'] and asset['digest'] == 'sha256:' + digest,
                      f'GitHub 附件摘要不一致：{name}')
              require(name not in checksums or checksums[name] == digest,
                      f'SHA256SUMS 校验失败：{name}')
              print(f'校验通过：{name} ({len(data)} bytes)')

          require(snapshot(view()) == snapshot(release), '校验期间草稿发生变化，停止发布。')
          gh('release', 'edit', tag, '--draft=false')
          published = view()
          require(not published['isDraft']
                  and published['isPrerelease'] == release['isPrerelease']
                  and published['targetCommitish'] == release['targetCommitish']
                  and published['body'] == release['body'], '发布后状态与草稿不一致。')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"已校验并发布七个附件：[下载 Release]({published['url']})\n")
          print(published['url'])

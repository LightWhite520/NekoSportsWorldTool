name: System location checks
on:
  pull_request:
  push:
    branches: [feat/system-location]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo test --locked --no-default-features
      - run: cargo check --locked
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: location-android
      - run: cargo check --locked --target aarch64-linux-android --features android --lib
      - name: Compile Java host
        run: |
          mkdir -p /tmp/neko-location-classes
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d /tmp/neko-location-classes android/java/org/nekosportsworld/tool/*.java
